{% extends "base.html" %}
{% block content %}
<h2>{{ mode }} {{ 'Artist' if mode == 'Add' else artist.artist_name }}</h2>
<form method="post" class="card">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Artist Name
        <input name="artist_name" placeholder="Enter an Artist Name" maxlength = "50" required>
    </label>
    <button>{{ 'Save Changes' if mode == 'Edit' else 'Add Artist' }}</button>
    <a class="btn" href="{{url_for('albums')}}" style="text-align: center;">Cancel</a>
</form>
{% endblock %}
