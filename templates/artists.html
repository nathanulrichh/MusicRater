{% extends "base.html" %}
{% block content %}
<h2>Artists</h2>
<form method="get" class="search">
    <input name="q" value="{{ q }}" placeholder="Enter Artist Name">
    <input type="hidden" name="sort" value="{{ sort }}">
    <button>Search</button>
</form>
<table>
    <thead><tr><th>ID</th><th>Name</th><th style="white-space: nowrap;">Most Recent Release</th></tr></thead>
    <tbody>
        {% for artist in artists %}
            <tr>
                <td>{{ artist.artist_id }}</td>
                <td>{{ artist.artist_name }}</td>
                <td>{{ artist.most_recent_release.strftime('%Y-%m-%d') if artist.most_recent_release else 'N/A' }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
